name: Export LunLux seven-slide PDF
on:
  push:
    paths:
      - .github/workflows/lunlux-export-once.yml
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install and build presentation
        working-directory: presentation
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          npm run build
      - name: Export seven-page PDF from Reveal print mode
        working-directory: presentation
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { spawn } from 'node:child_process';
          const server = spawn('node', ['node_modules/vite/bin/vite.js','preview','--host','127.0.0.1','--port','5188','--strictPort'], {stdio:'ignore'});
          const sleep = ms => new Promise(resolve=>setTimeout(resolve,ms));
          try {
            let ready = false;
            for (let i=0;i<60;i++) {
              try {
                const response=await fetch('http://127.0.0.1:5188/?print-pdf');
                if(response.ok) {ready=true;break;}
              } catch {}
              await sleep(250);
            }
            if (!ready) throw Error('Preview server not ready');
            const browser = await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            try {
              const page = await browser.newPage({viewport:{width:1440,height:810},deviceScaleFactor:1});
              const errors=[];
              page.on('pageerror',error=>errors.push(error.message));
              page.on('response',response=>{if(response.status()>=400) errors.push(response.status()+' '+response.url())});
              await page.goto('http://127.0.0.1:5188/?print-pdf',{waitUntil:'networkidle',timeout:45000});
              await page.evaluate(()=>document.fonts.ready);
              await sleep(800);
              const unloaded = await page.locator('.slides img').evaluateAll(images=>images.filter(img=>!img.complete||!img.naturalWidth).map(img=>img.src));
              if (unloaded.length || errors.length) throw Error(JSON.stringify({unloaded,errors}));
              await page.pdf({path:'LunLux-demo.pdf',printBackground:true,preferCSSPageSize:true,landscape:true,scale:1});
            } finally {await browser.close();}
          } finally {server.kill('SIGTERM');}
          NODE
      - name: Verify and commit PDF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          pdfinfo presentation/LunLux-demo.pdf | grep -E 'Pages: *7$'
          test "$(pdfinfo presentation/LunLux-demo.pdf | awk '/^Pages:/ {print $2}')" = "7"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add presentation/LunLux-demo.pdf
          git commit -m 'Presentation: export verified seven-page PDF'
          git push origin HEAD:main
