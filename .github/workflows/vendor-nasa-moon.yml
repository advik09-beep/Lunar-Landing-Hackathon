name: One-time NASA Moon image vendoring
on:
  push:
    branches: [main]
    paths: ['.github/workflows/vendor-nasa-moon.yml']
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch and validate exact NASA SVS asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p web/public/moon
          curl --fail --show-error --silent --location --retry 3 --max-time 60 \
            'https://svs.gsfc.nasa.gov/vis/a000000/a004700/a004720/lroc_color_2k.jpg' \
            --output web/public/moon/lroc_color_2k.jpg
          echo 'f7130a1822681fa7512d7dcfd40db8c10b9ba4f06777910348698260ed7a2170  web/public/moon/lroc_color_2k.jpg' | sha256sum --check
          test "$(wc -c < web/public/moon/lroc_color_2k.jpg)" -eq 457942
      - name: Commit image permanently into web/public/moon
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/public/moon/lroc_color_2k.jpg
          git commit -m 'Vendor validated NASA CGI Moon Kit JPEG into web/public/moon'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
